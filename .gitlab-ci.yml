stages:
  - test

validate-powershell:
  stage: test
  image: mcr.microsoft.com/powershell:lts-alpine
  script:
    - pwsh -Command "foreach (\$s in @('./scripts/profile.ps1', './scripts/uninstall.ps1')) { Write-Host \"Checking PowerShell syntax for \$s...\"; \$errors = \$null; \$content = Get-Content -Raw \$s; [System.Management.Automation.Language.Parser]::ParseInput(\$content, [ref]\$null, [ref]\$errors); if (\$errors) { \$errors | Format-Table -AutoSize; exit 1 } }; Write-Host 'Syntax validation passed!' -ForegroundColor Green"

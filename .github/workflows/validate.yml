name: Validate Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-powershell:
    name: Lint & Syntax Check (PowerShell)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Script Syntax
        shell: pwsh
        run: |
          Write-Host "Checking PowerShell syntax for ./scripts/profile.ps1..."
          $errors = $null
          $content = Get-Content -Raw ./scripts/profile.ps1
          [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | Format-Table -AutoSize
            throw "Syntax error(s) found in scripts/profile.ps1"
          }
          Write-Host "Syntax validation passed!" -ForegroundColor Green

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer..."
          $results = Invoke-ScriptAnalyzer -Path ./scripts/profile.ps1 -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found blocking errors."
          }
          Write-Host "PSScriptAnalyzer validation passed!" -ForegroundColor Green

  validate-macos-shell:
    name: Lint & Syntax Check (macOS Shell)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate macOS Shell Script Syntax
        run: |
          echo "Checking syntax for ./scripts/profile.sh..."
          bash -n ./scripts/profile.sh
          sh -n ./scripts/profile.sh
          echo "Shell syntax validation passed!"
